# Publishes a GitHub Release (binaries + packages) for every vX.Y.Z tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GoReleaser needs the tags for the changelog

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Checks
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
